<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>外业测量 · 平板版</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#123a63">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="btnOpen" class="primary">打开图纸</button>
  <button id="btnFit">适应</button>
  <button id="btnZoomIn">放大+</button>
  <button id="btnZoomOut">缩小-</button>
  <button id="btnRot">旋转</button>
  <span id="status" class="status">未加载图纸</span>
  <span id="bleState" class="ble">蓝牙未连接</span>
  <button id="btnBle">连接徕卡</button>
  <button id="btnBleOff">断开</button>
</header>
<input type="file" id="fileInput" accept="*/*" hidden>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<div id="toolbar">
  <button data-mode="draw">手绘</button>
  <button data-mode="select" class="active">点选</button>
  <button data-mode="addline">加线</button>
  <button data-mode="split">分割</button>
  <button data-mode="note">点注</button>
  <button data-mode="crop">框选范围</button>
  <button id="btnCropClear">清除框选</button>
  <button id="btnCropTrace">框选识别</button>
  <button id="btnTrace">自动描线</button>
  <button id="btnInterior">内部识别</button>
  <button id="btnInteriorUndo">撤回内部</button>
  <button id="btnOutline">画轮廓</button>
  <button id="btnClose">闭合</button>
  <button id="btnInputLen">输入长度</button>
  <button id="btnDelete">删除选中</button>
  <button id="btnUndo">撤回</button>
  <button id="btnClearAll">清空</button>
  <button id="btnPhoto">拍照</button>
  <button id="btnPickPhoto">选图片</button>
  <button id="btnViewPhoto">查看照片</button>
  <label class="thick">墙厚mm <input id="thick" type="number" inputmode="numeric" value="200"></label>
  <select id="adj">
    <option value="">无属性</option>
    <option value="++">++</option>
    <option value="+-">+-</option>
    <option value="--">--</option>
  </select>
  <button id="btnApplyAdj">应用修正</button>
  <button id="btnCsv">导出CSV</button>
  <button id="btnPdf">导出PDF手稿</button>
</div>

<main id="stage">
  <canvas id="cv"></canvas>
  <div id="hint" class="hint">点「打开图纸」→ 选择 PDF 或图片；单指拖动平移，双指缩放。</div>
</main>

<section id="panel">
  <div class="panel-head">
    <span id="panelTitle">线段 / 注记</span>
    <button id="btnPanel" class="small">收起</button>
  </div>
  <div id="list" class="list"></div>
</section>

<script src="lib/pdf.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="app.js?v=24"></script>
</body>
</html>
